metadata:
  description: Build cartoon characters, animate them with joints and sticks, then hold and drag them to record them moving
    in your own cartoon movie, with voices and music.
  logo_img: asset:icon-512.png
  title: 'ToonyLoony: build and animate your own cartoon movies'
name: ToonyLoony
