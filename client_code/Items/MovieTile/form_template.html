<div class="tl-tile-wrap">
  <a class="tl-tile hm-movie" anvil:name="link" href="#studio">
    <div class="pic wide"><img alt="" anvil:dom-node="pic"><span class="tl-emoji" anvil:dom-node="noimg" aria-hidden="true">🎬</span>
      <anvil-component type="Label" name="shared_badge" prop:text="Shared" prop:role='["badge", "badge-brand", "tile-badge"]'></anvil-component>
      <anvil-component type="Label" name="format_badge" prop:role='["badge", "tile-fmt"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="name_label" prop:role='["tile-name"]'></anvil-component>
    <anvil-component type="Label" name="sub_label" prop:role='["tile-sub"]'></anvil-component>
  </a>
  <anvil-component type="Button" name="more_button" prop:text="More" prop:role='["btn", "btn-icon", "hm-more", "ic-more"]'></anvil-component>
</div>
